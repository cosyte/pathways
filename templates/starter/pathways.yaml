# yaml-language-server: $schema=./node_modules/@cosyte/pathways/schema/project.json
# The line above points an editor with the YAML language server at the schema of this file,
# for completion, hover text and checks as you type. "pathways validate" checks the rest.

# Settings for the whole project. Every key but encryption is optional; the values below are the
# defaults.

storage:
  sqlite:
    # The message database, relative to this file. Stored messages can hold patient data, so
    # .gitignore keeps this folder out of git.
    file: .pathways/pathways.db
  # Or a database server in place of sqlite: postgres, mysql (MySQL or MariaDB) or sqlserver. Add its
  # driver to the project (npm install pg, mysql2, or tedious tarn); the Docker image carries all
  # of them. Its connection URL holds the password, so it is read from an environment variable,
  # PATHWAYS_DATABASE_URL unless url says another; tls: {} verifies the server against Node's
  # built-in roots, tls: { ca: path } against your own CA:
  #   postgres: { url: { env: PATHWAYS_DATABASE_URL }, tls: {} }

# Every stored message, and every error stored with one, is encrypted with a data key of its own,
# which the master key named by `current` wraps. `pathways start` needs this setting: a list of keys,
# or `encryption: none` to store messages unencrypted.
#
# `pathways init` generated the key below for development on this machine: .gitignore keeps
# .pathways/ out of git. Production keys come from a secret store, read when the engine starts from
# an environment variable ({ id: ..., env: NAME }) or from a file the secret store mounts
# ({ id: ..., file: path }). A key is 32 random bytes in base64 (`openssl rand -base64 32`); it never
# goes in this file. To rotate, add a new key and make it current, run `pathways rekey`, then remove
# the old key. On a database server, which keeps earlier row versions in its logs and backups for a
# while, remove it once those no longer hold rows written under it.
encryption:
  keys:
    - id: dev
      file: .pathways/dev.key
  current: dev

# Each channel's channel.yaml can override timeout, memory and retention for that channel.
defaults:
  # How long one message's transform may run before it is stopped and the message is marked
  # failed.
  timeout: 5s
  # The memory cap of each channel's transform worker.
  memory: 256MB
  # How often `pathways start` looks for new files.
  pollInterval: 1s
  # How long a delivered, filtered or cleared message is kept after its last activity before it
  # is deleted. Failed messages are kept until they are replayed or cleared. "pathways retention
  # --dry-run" says what would go.
  retention: 30d
