version: 2
updates:
  # A release becomes eligible a day after it is published (`cooldown`), the same 24 hours
  # pnpm-workspace.yaml's minimumReleaseAge holds every install to, which keeps a release that is
  # pulled within hours out of this repository. Security updates are not delayed. Commit messages
  # take the chore prefix and the dependency scope, so a Dependabot title passes pr-title.yml.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    # From v1.75.0 reviewdog/action-actionlint installs actionlint from a fork with `curl | bash`.
    # The shared CI runs rhysd/actionlint's own release, checked by SHA-256, so it is never proposed.
    ignore:
      - dependency-name: "reviewdog/action-actionlint"
    commit-message:
      prefix: chore
      include: scope
