version: 2
updates:
  # A release becomes eligible a day after it is published (`cooldown`), the same 24 hours
  # pnpm-workspace.yaml's minimumReleaseAge holds every install to, which keeps a release that is
  # pulled within hours out of this repository. Security updates are not delayed. Commit messages
  # take the chore prefix and the dependency scope, so a Dependabot title passes pr-title.yml.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node describes the oldest Node this package runs on (engines: >=24), so it stays on
      # the 24 line. A newer major type-checks calls that Node 24 does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @cosyte/process owns the tool versions. vitest stays a direct devDependency only because test
      # files import it (typecheck needs its types), pinned to exactly the version process runs;
      # `cosyte-process check` and test/scripts/process-wiring.test.ts fail on a mismatch. It moves
      # when process does, never on its own.
      - dependency-name: "vitest"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    # From v1.75.0 reviewdog/action-actionlint installs actionlint from a fork with `curl | bash`.
    # The shared CI runs rhysd/actionlint's own release, checked by SHA-256, so it is never proposed.
    ignore:
      - dependency-name: "reviewdog/action-actionlint"
      # The cosyte/.github reusable workflows are pinned to the commit of a published `workflows-*`
      # reference and move by hand, with every caller here, together (ST37). Left to Dependabot, a
      # commit pin with no version tag is offered the newest commit on cosyte/.github's main, which is
      # not a published reference.
      - dependency-name: "cosyte/.github*"
    commit-message:
      prefix: chore
      include: scope
