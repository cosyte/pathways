name: Em-dash gate

# The brand rule, checked on every tracked file and, on a pull request, on its title, body and
# commit messages. The shared workflow runs `pnpm check:no-emdash` (scripts/check-no-emdash.mjs).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-emdash:
    uses: cosyte/.github/.github/workflows/gate-no-emdash.yml@84ecccd771cbc9c1ece003a3f8ff61415360395b # workflows-2026-09-18-84ecccd771cb
    permissions:
      contents: read
