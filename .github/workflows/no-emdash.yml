name: Em-dash gate

# The brand rule, checked on every tracked file and, on a pull request, on its title, body and
# commit messages.
#
# The shared gate runs on Node 22 and installs nothing. Its default command, `pnpm check:no-emdash`,
# fails there before the script runs, because pnpm refuses a package whose engines.node starts at
# 24. So we pass the script itself: it is plain Node with no dependencies.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

# No concurrency group. A push and a title or body edit can arrive together (Dependabot does both),
# and a run a group cancels, even a queued one under `cancel-in-progress: false`, can count as a
# failed required check and block the merge until someone re-runs it. Each run takes seconds, so
# every one finishes and the newest result stands.

permissions:
  contents: read

jobs:
  no-emdash:
    uses: cosyte/.github/.github/workflows/gate-no-emdash.yml@498c7c13c8869bf11b67fa8324684ec2dc691ec6 # workflows-2026-11-07-498c7c13c886
    with:
      files-command: "node scripts/check-no-emdash.mjs"
      messages-command: "node scripts/check-no-emdash.mjs --stdin"
    permissions:
      contents: read
