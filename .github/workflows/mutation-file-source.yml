# A one-off measurement for one pull request: the mutation score of the file source,
# src/connectors/file.ts, under the file source's own tests, before this change and after it. It is
# removed again before the pull request merges; the numbers go in the pull request body.
name: mutation-file-source

on:
  pull_request:
    paths:
      - .github/workflows/mutation-file-source.yml

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        side: [before, after]
    env:
      BEFORE: 3930ea2b666e1a151b01eeabc4f291691059c360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The source and tests before the change
        if: ${{ matrix.side == 'before' }}
        run: git checkout "${BEFORE}" -- src test
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D @stryker-mutator/core@10.1.1 @stryker-mutator/vitest-runner@10.1.1
      - name: Write the configs
        run: |
          cat > vitest.mutation.config.ts <<'EOF'
          import type { ViteUserConfig } from "vitest/config";

          import shared from "./vitest.config.js";

          const config = shared as ViteUserConfig;

          export default {
            ...config,
            test: {
              ...config.test,
              include: ["test/file-source*.test.ts"],
              coverage: { enabled: false },
            },
          } satisfies ViteUserConfig;
          EOF
          cat > stryker.config.json <<'EOF'
          {
            "testRunner": "vitest",
            "vitest": { "configFile": "vitest.mutation.config.ts" },
            "plugins": ["@stryker-mutator/vitest-runner"],
            "mutate": ["src/connectors/file.ts"],
            "coverageAnalysis": "perTest",
            "ignoreStatic": true,
            "concurrency": 4,
            "timeoutFactor": 3,
            "timeoutMS": 10000,
            "reporters": ["clear-text", "progress", "json"],
            "jsonReporter": { "fileName": "reports/mutation/mutation.json" },
            "thresholds": { "high": 100, "low": 0, "break": null }
          }
          EOF
      - run: pnpm exec stryker run
      - name: The scores
        if: ${{ !cancelled() }}
        env:
          SIDE: ${{ matrix.side }}
        run: |
          git diff -U0 "${BEFORE}" -- src/connectors/file.ts > changed.diff || true
          node --input-type=module - <<'EOF' | tee -a "${GITHUB_STEP_SUMMARY}"
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("reports/mutation/mutation.json", "utf8"));
          const mutants = Object.values(report.files).flatMap((file) => file.mutants);
          const changed = new Set();
          for (const line of readFileSync("changed.diff", "utf8").split("\n")) {
            const hunk = /^@@ -\S+ \+(\d+)(?:,(\d+))? @@/.exec(line);
            if (!hunk) continue;
            const start = Number(hunk[1]);
            const count = hunk[2] === undefined ? 1 : Number(hunk[2]);
            for (let at = start; at < start + count; at += 1) changed.add(at);
          }
          const score = (list) => {
            const tally = {};
            for (const m of list) tally[m.status] = (tally[m.status] ?? 0) + 1;
            const killed = (tally.Killed ?? 0) + (tally.Timeout ?? 0);
            const valid = killed + (tally.Survived ?? 0) + (tally.NoCoverage ?? 0);
            const pct = valid === 0 ? "n/a" : ((100 * killed) / valid).toFixed(2);
            return `${pct}% (${killed} of ${valid} killed; ${JSON.stringify(tally)})`;
          };
          console.log(`### ${process.env.SIDE}: src/connectors/file.ts`);
          console.log("");
          console.log(`- whole file: ${score(mutants)}`);
          if (process.env.SIDE === "after") {
            const inChanged = mutants.filter((m) => changed.has(m.location.start.line));
            console.log(`- lines this change touched: ${score(inChanged)}`);
            for (const m of inChanged.filter((m) => m.status === "Survived" || m.status === "NoCoverage")) {
              console.log(`  - line ${m.location.start.line}: ${m.mutatorName} ${m.status}: ${JSON.stringify(m.replacement ?? "")}`);
            }
          }
          EOF
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.side }}
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 14
