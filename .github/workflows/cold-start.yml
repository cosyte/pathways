name: Cold start

# The published package from the npm registry, run by hand as a new team meets it:
# scripts/cold-start.sh says what it runs. It installs nothing of this checkout and never fails on
# what it finds: each stall is listed at the end of its log and in the job summary.

on:
  push:
    branches: [docs/cold-start-run]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-start:
    name: cold-start
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run the cold start in empty folders
        run: bash scripts/cold-start.sh
