name: Docker

# Builds the image from the Dockerfile and runs it against a starter project written by
# `pathways init` inside the image: `--version`, `pathways test`, `pathways start --once`, the
# default command as the nonroot user stopped by `docker stop`, the HEALTHCHECK against the probe
# listener, and the debug target's shell. Those
# store messages in SQLite, the default. `pathways start --once` then runs again on PostgreSQL,
# MySQL, MariaDB and SQL Server, service containers here, through the drivers the image carries: pg,
# mysql2 (for MySQL and MariaDB), and tedious with tarn.
#
# Two more jobs, which no ruleset names:
#
# - `platforms` runs the release's image steps (release.yml, `image-publish`) in the release's
#   order, against a registry that lives for the job on the runner's loopback instead of GHCR: each
#   of linux/amd64 and linux/arm64 built alone (arm64 under QEMU) and run on a starter project on
#   SQLite; the check that the version is not published yet; both built together with the SBOM and
#   provenance the release attaches and pushed by digest alone; both platforms pulled back by
#   digest with their attestations checked; and only then the version tag put on that digest. It
#   has no login and does not sign. test/package.test.ts holds its steps equal to the release's.
# - `project-image` builds a starter project's own image from its Dockerfile (templates/starter/),
#   FROM this image by digest, through a registry that lives for the job on the runner's loopback.
#
# Nothing here pushes to a public registry or signs: release.yml publishes the image to
# ghcr.io/cosyte/pathways on each release, and only there.
#
# A REQUIRED CHECK. The ruleset `ci-required-checks` names `image`, so a red run here blocks the
# merge. That is why the workflow has no path filter: a required check whose workflow a filter
# skips stays pending, and the pull request cannot merge. It is its own workflow, outside ci.yml's
# shared `ci` job, so an edit here never changes the contexts that job reports. Never rename the
# `image` job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same images and digests as databases.yml, which says how to move them. They live for one
    # job on the runner's loopback, hold synthetic messages only, and run without TLS, under a
    # throwaway password that is not a secret.
    services:
      # postgres:17 (PostgreSQL 17.11), pinned 2026-11-07.
      postgres:
        image: postgres@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: Pathways-CI-0000
          POSTGRES_DB: pathways
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      # mysql:8.4 (MySQL 8.4.13), pinned 2026-11-07.
      mysql:
        image: mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: Pathways-CI-0000
          MYSQL_DATABASE: pathways
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      # mariadb:11 (MariaDB 11.8.9), pinned 2026-11-07.
      mariadb:
        image: mariadb@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
        env:
          MARIADB_ROOT_PASSWORD: Pathways-CI-0000
          MARIADB_DATABASE: pathways
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      # mcr.microsoft.com/mssql/server:2022-latest (SQL Server 2022 CU27 GDR, 16.0.4305.5), pinned
      # 2026-11-07.
      sqlserver:
        image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Pathways-CI-0000
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Pathways-CI-0000 -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    env:
      IMAGE: pathways:ci
      DEBUG_IMAGE: pathways:ci-debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Built locally and loaded into the runner's Docker only. No registry login, no push.
      - name: Build the image
        run: docker build --tag "$IMAGE" .
      - name: Build the debug target
        run: docker build --target debug --tag "$DEBUG_IMAGE" .

      - name: The image has no shell
        run: |
          for shell in /bin/sh /busybox/sh; do
            if docker run --rm --entrypoint "$shell" "$IMAGE" -c true 2>/dev/null; then
              echo "::error::the image has a shell at $shell"
              exit 1
            fi
          done

      - name: pathways --version prints the package's version
        run: |
          expected="$(jq -r .version package.json)"
          actual="$(docker run --rm "$IMAGE" --version)"
          echo "pathways --version: $actual"
          test "$actual" = "$expected"

      # Run as the runner's own user, so the files it writes are the runner's to change.
      - name: pathways init writes a starter project into an empty folder
        run: |
          project="$RUNNER_TEMP/project"
          mkdir "$project"
          docker run --rm --user "$(id -u):$(id -g)" --volume "$project:/project" "$IMAGE" init /project
          test -f "$project/pathways.yaml"
          test -f "$project/channels/adt-to-lab/channel.yaml"

      # As the image's nonroot user, from a read-only mount: test reads the project and writes nothing.
      - name: pathways test passes on the starter project
        run: docker run --rm --volume "$RUNNER_TEMP/project:/project:ro" "$IMAGE" test

      - name: pathways start --once delivers the A01 to the lab and filters the A08
        run: |
          project="$RUNNER_TEMP/project"
          inbox="$project/data/adt-to-lab/in"
          outbox="$project/data/adt-to-lab/out"
          mkdir -p "$inbox"
          cp "$project/channels/adt-to-lab/tests/a01.hl7" "$project/channels/adt-to-lab/tests/a08.hl7" "$inbox/"
          # The starter's file source reads a file once it has sat unchanged for a second.
          touch -d '1 minute ago' "$inbox/a01.hl7" "$inbox/a08.hl7"
          docker run --rm --user "$(id -u):$(id -g)" --volume "$project:/project" "$IMAGE" start --once
          delivered="$(find "$outbox" -type f -printf '%P\n' | sort)"
          echo "delivered: $delivered"
          test "$delivered" = "1-1.hl7"
          cmp "$outbox/1-1.hl7" "$project/channels/adt-to-lab/tests/a01.expected.hl7"
          test -f "$project/.pathways/pathways.db"
          # Each file is deleted once it is stored, encrypted: the inbox keeps no plaintext copy.
          test -z "$(find "$inbox" -type f)"

      # The way most people will run it: the default command (`start -C /project`) as uid 65532,
      # stopped with SIGTERM by `docker stop`, which must end it cleanly with exit code 0. The
      # starter has no probes block, and the image's HEALTHCHECK must still call it healthy.
      - name: The default command runs as nonroot and stops cleanly on docker stop
        run: |
          project="$RUNNER_TEMP/project"
          inbox="$project/data/adt-to-lab/in"
          cp "$project/channels/adt-to-lab/tests/a01.hl7" "$inbox/next.hl7"
          touch -d '1 minute ago' "$inbox/next.hl7"
          sudo chown -R 65532:65532 "$project"
          docker run --detach --name pathways-ci --health-interval 1s \
            --volume "$project:/project" "$IMAGE"
          for _ in $(seq 1 30); do
            if [ -f "$project/data/adt-to-lab/out/3-1.hl7" ]; then break; fi
            sleep 1
          done
          health=""
          for _ in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' pathways-ci)"
            if [ "$health" = healthy ]; then break; fi
            sleep 1
          done
          docker stop pathways-ci
          code="$(docker inspect --format '{{.State.ExitCode}}' pathways-ci)"
          # The engine logs ids, counts and events, never message content.
          docker logs pathways-ci
          docker rm pathways-ci
          echo "health without a probes block: $health, exit code after docker stop: $code"
          test "$health" = healthy
          test "$code" = 0
          cmp "$project/data/adt-to-lab/out/3-1.hl7" "$project/channels/adt-to-lab/tests/a01.expected.hl7"

      # The image's HEALTHCHECK runs `pathways probe` against the probes block: the container turns
      # healthy, and `probe --ready` says ready. The interval is shortened here only.
      - name: The health check reads the probe listener
        run: |
          project="$RUNNER_TEMP/project"
          # The project is uid 65532's since the step before.
          printf 'probes:\n  port: 9091\n  plaintext: true\n' | sudo tee -a "$project/pathways.yaml" > /dev/null
          docker run --detach --name pathways-probes --health-interval 1s --health-start-period 30s \
            --volume "$project:/project" "$IMAGE"
          status=""
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' pathways-probes)"
            if [ "$status" = healthy ]; then break; fi
            sleep 1
          done
          ready="$(docker exec pathways-probes /nodejs/bin/node /app/dist/bin/pathways.mjs probe --ready -C /project || true)"
          docker stop pathways-probes
          code="$(docker inspect --format '{{.State.ExitCode}}' pathways-probes)"
          docker logs pathways-probes
          docker rm pathways-probes
          echo "health: $status, probe --ready: $ready, exit code after docker stop: $code"
          test "$status" = healthy
          test "$ready" = ready
          test "$code" = 0

      # Each server gets a starter project of its own whose pathways.yaml stores messages there, in
      # a database of its own. The image reaches the service containers on the runner's loopback,
      # so it runs on the host's network. MariaDB is named by the storage kind `mysql`.
      - name: pathways start --once delivers the A01 through PostgreSQL, MySQL, MariaDB and SQL Server
        env:
          SQLSERVER_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          docker exec "$SQLSERVER_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa \
            -P Pathways-CI-0000 -b -Q "CREATE DATABASE pathways"
          declare -A urls=(
            [postgres]="postgres://postgres:Pathways-CI-0000@127.0.0.1:5432/pathways"
            [mysql]="mysql://root:Pathways-CI-0000@127.0.0.1:3306/pathways"
            [mariadb]="mysql://root:Pathways-CI-0000@127.0.0.1:3307/pathways"
            [sqlserver]="sqlserver://sa:Pathways-CI-0000@127.0.0.1:1433/pathways"
          )
          declare -A kinds=([postgres]=postgres [mysql]=mysql [mariadb]=mysql [sqlserver]=sqlserver)
          for server in postgres mysql mariadb sqlserver; do
            echo "::group::$server"
            kind="${kinds[$server]}"
            project="$RUNNER_TEMP/$server"
            mkdir "$project"
            docker run --rm --user "$(id -u):$(id -g)" --volume "$project:/project" "$IMAGE" init /project
            # The server in place of SQLite, with the starter's development key.
            printf 'storage:\n  %s: { plaintext: true }\nencryption:\n  keys:\n    - id: dev\n      file: .pathways/dev.key\n  current: dev\n' \
              "$kind" > "$project/pathways.yaml"
            inbox="$project/data/adt-to-lab/in"
            mkdir -p "$inbox"
            cp "$project/channels/adt-to-lab/tests/a01.hl7" "$project/channels/adt-to-lab/tests/a08.hl7" "$inbox/"
            touch -d '1 minute ago' "$inbox/a01.hl7" "$inbox/a08.hl7"
            run=(docker run --rm --network host --user "$(id -u):$(id -g)"
              --env "PATHWAYS_DATABASE_URL=${urls[$server]}" --volume "$project:/project" "$IMAGE")
            "${run[@]}" start --once
            cmp "$project/data/adt-to-lab/out/1-1.hl7" "$project/channels/adt-to-lab/tests/a01.expected.hl7"
            test -z "$(find "$inbox" -type f)"
            # Stored on the server: no SQLite file, and the status command reads both messages back.
            test ! -e "$project/.pathways/pathways.db"
            counts="$("${run[@]}" status --json | jq -c '.channels["adt-to-lab"] | [.messages.transformed, .messages.filtered, .deliveries.delivered]')"
            echo "$server: transformed, filtered, delivered: $counts"
            test "$counts" = "[1,1,1]"
            echo "::endgroup::"
          done

      - name: The debug target has a shell and the same command
        run: |
          docker run --rm --entrypoint /busybox/sh "$DEBUG_IMAGE" -c 'echo the debug shell runs'
          test "$(docker run --rm "$DEBUG_IMAGE" --version)" = "$(jq -r .version package.json)"

      - name: Image sizes
        run: |
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' pathways | tee -a "$GITHUB_STEP_SUMMARY"

  # The release's image steps, against the job's own registry: keep them in step with release.yml's
  # `image-publish` (test/package.test.ts compares them). No login and no signature, and nothing
  # leaves the runner.
  platforms:
    runs-on: ubuntu-latest
    # The arm64 builds run under QEMU on the hosted amd64 runner.
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      # registry:3, pinned as in `project-image`.
      registry:
        image: registry@sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
        ports:
          - 5000:5000
    env:
      IMAGE: localhost:5000/cosyte/pathways
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version and the commit
        run: |
          set -euo pipefail
          echo "VERSION=$(jq -r .version package.json)" >> "$GITHUB_ENV"
          echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      # On the host's network, so the builder reaches the job's registry on the loopback.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Build each platform alone and run it on a starter project
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "::group::linux/$arch"
            platform="linux/$arch"
            docker buildx build --platform "$platform" --load --tag "pathways:$arch" .
            actual="$(docker run --rm --platform "$platform" "pathways:$arch" --version)"
            echo "$platform pathways --version: $actual"
            test "$actual" = "$VERSION"
            project="$RUNNER_TEMP/$arch"
            mkdir "$project"
            run=(docker run --rm --platform "$platform" --user "$(id -u):$(id -g)" --volume "$project:/project")
            "${run[@]}" "pathways:$arch" init /project
            "${run[@]}" "pathways:$arch" test
            inbox="$project/data/adt-to-lab/in"
            mkdir -p "$inbox"
            cp "$project/channels/adt-to-lab/tests/a01.hl7" "$project/channels/adt-to-lab/tests/a08.hl7" "$inbox/"
            touch -d '1 minute ago' "$inbox/a01.hl7" "$inbox/a08.hl7"
            # SQLite, through this platform's native better-sqlite3 binary.
            "${run[@]}" "pathways:$arch" start --once
            cmp "$project/data/adt-to-lab/out/1-1.hl7" "$project/channels/adt-to-lab/tests/a01.expected.hl7"
            echo "::endgroup::"
          done
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' pathways | tee -a "$GITHUB_STEP_SUMMARY"

      # The job's registry is empty, so this takes the not-found arm. Any answer it does not know
      # stops the run, as it does on a release.
      - name: The version is still not published
        id: absent
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > "$RUNNER_TEMP/absent.txt" 2>&1; then
            echo "::notice::$IMAGE:$VERSION was published by another run; nothing to do"
            echo "absent=false" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown|name unknown|denied' "$RUNNER_TEMP/absent.txt"; then
            echo "absent=true" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/absent.txt"
            echo "::error::could not tell whether $IMAGE:$VERSION is published"
            exit 1
          fi

      # By digest alone, as the release pushes it. The release signs it and checks the signature
      # here, before the steps below.
      - name: Build both platforms with SBOM and provenance, and push them by digest
        id: build
        if: steps.absent.outputs.absent == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.REVISION }}

      - name: Pull the image by digest and check both platforms and their attestations
        if: steps.absent.outputs.absent == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$ref"
            test "$(docker run --rm --platform "$platform" "$ref" --version)" = "$VERSION"
          done
          # The index holds both platforms, and one attestation manifest for each that names it.
          docker buildx imagetools inspect "$ref" --raw > "$RUNNER_TEMP/index.json"
          test "$(jq -c '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort' "$RUNNER_TEMP/index.json")" = '["amd64","arm64"]'
          images="$(jq -c '[.manifests[] | select(.platform.os == "linux") | .digest] | sort' "$RUNNER_TEMP/index.json")"
          attested="$(jq -c '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .annotations["vnd.docker.reference.digest"]] | sort' "$RUNNER_TEMP/index.json")"
          echo "platform manifests $images, attested $attested"
          test "$images" = "$attested"
          # Each attestation manifest carries an SPDX SBOM and SLSA provenance.
          for attestation in $(jq -r '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest' "$RUNNER_TEMP/index.json"); do
            docker buildx imagetools inspect "$IMAGE@$attestation" --raw > "$RUNNER_TEMP/attestation.json"
            jq -e '[.layers[].annotations["in-toto.io/predicate-type"]] | (any(startswith("https://spdx.dev/"))) and (any(startswith("https://slsa.dev/provenance/")))' "$RUNNER_TEMP/attestation.json"
          done

      # Last, and only on the checked digest. With one source index and no annotations, imagetools
      # copies the index byte for byte; the dry run proves the digest is unchanged before the tag is
      # written, and the read back after it proves the tag names the checked digest.
      - name: Tag the verified digest with the version
        if: steps.absent.outputs.absent == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          docker buildx imagetools create --dry-run --tag "$IMAGE:$VERSION" "$ref" > "$RUNNER_TEMP/planned.json"
          planned="sha256:$(printf '%s' "$(cat "$RUNNER_TEMP/planned.json")" | sha256sum | cut -d ' ' -f 1)"
          echo "tagging $ref as $IMAGE:$VERSION, which would name $planned"
          test "$planned" = "$DIGEST"
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$ref"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw > "$RUNNER_TEMP/tagged.json"
          tagged="sha256:$(printf '%s' "$(cat "$RUNNER_TEMP/tagged.json")" | sha256sum | cut -d ' ' -f 1)"
          test "$tagged" = "$DIGEST"
          {
            echo "### $IMAGE $VERSION"
            echo
            echo "- \`$IMAGE:$VERSION\`"
            echo "- \`$ref\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # A starter project's own image, as a team builds it: FROM the Pathways image by digest, with the
  # channels copied in, a dependency installed in the build stage, and `pathways validate` and
  # `pathways test` run by the build. The Pathways image is pushed to a registry that lives for this
  # job on the runner's loopback, so the project's Dockerfile can name it by digest.
  project-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      # registry:3 (the CNCF distribution registry), pinned 2026-11-11. Its digest is a
      # multi-platform index.
      registry:
        image: registry@sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image and push it to the job's registry
        run: |
          set -euo pipefail
          docker build --tag localhost:5000/pathways:ci .
          docker push localhost:5000/pathways:ci
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' localhost:5000/pathways:ci)"
          echo "the image by digest: $ref"
          echo "PATHWAYS_IMAGE=$ref" >> "$GITHUB_ENV"

      # @cosyte/pathways is a devDependency and stays out of the image; @cosyte/hl7 stands in for an
      # extension or a cloud package, which the build stage installs.
      - name: pathways init writes a project with a Dockerfile and a .dockerignore
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/project"
          mkdir "$project"
          docker run --rm --user "$(id -u):$(id -g)" --volume "$project:/project" "$PATHWAYS_IMAGE" init /project
          test -f "$project/Dockerfile"
          test -f "$project/.dockerignore"
          jq '.dependencies = {"@cosyte/hl7": "^0.1.9"}' "$project/package.json" > "$RUNNER_TEMP/package.json"
          mv "$RUNNER_TEMP/package.json" "$project/package.json"

      - name: The project's Dockerfile refuses a Pathways image named by a tag alone
        run: |
          set -euo pipefail
          if docker build --build-arg PATHWAYS_IMAGE=localhost:5000/pathways:ci "$RUNNER_TEMP/project" > "$RUNNER_TEMP/tag.log" 2>&1; then
            echo "::error::the project image built FROM a tag"
            exit 1
          fi
          grep -F "name it by digest" "$RUNNER_TEMP/tag.log"

      - name: A configuration that does not validate, or a channel test that fails, stops the build
        run: |
          set -euo pipefail
          invalid="$RUNNER_TEMP/invalid"
          cp -r "$RUNNER_TEMP/project" "$invalid"
          sed -i 's/^  timeout: 5s$/  timeout: soon/' "$invalid/pathways.yaml"
          grep -q '^  timeout: soon$' "$invalid/pathways.yaml"
          if docker build --progress plain --build-arg PATHWAYS_IMAGE="$PATHWAYS_IMAGE" "$invalid" > "$RUNNER_TEMP/invalid.log" 2>&1; then
            echo "::error::a project whose configuration does not validate built"
            exit 1
          fi
          grep -E 'pathways\.mjs validate .*did not complete successfully' "$RUNNER_TEMP/invalid.log"
          failing="$RUNNER_TEMP/failing"
          cp -r "$RUNNER_TEMP/project" "$failing"
          printf 'PID|1||NOT-THE-EXPECTED-OUTPUT\r' >> "$failing/channels/adt-to-lab/tests/a01.expected.hl7"
          if docker build --progress plain --build-arg PATHWAYS_IMAGE="$PATHWAYS_IMAGE" "$failing" > "$RUNNER_TEMP/failing.log" 2>&1; then
            echo "::error::a project whose channel test fails built"
            exit 1
          fi
          grep -E 'pathways\.mjs test .*did not complete successfully' "$RUNNER_TEMP/failing.log"

      - name: Build the project's image FROM the image by digest
        run: docker build --build-arg PATHWAYS_IMAGE="$PATHWAYS_IMAGE" --tag project:ci "$RUNNER_TEMP/project"

      # The channels, the project's package.json and its installed dependency are in /project; the
      # development key, the database, the message folders and the Dockerfile are not.
      - name: The project image holds the channels and the dependency, and no key or messages
        run: |
          set -euo pipefail
          docker run --rm project:ci test
          docker run --rm --entrypoint /nodejs/bin/node project:ci --input-type=module --eval '
            import { existsSync } from "node:fs";
            const present = ["channels/adt-to-lab/channel.yaml", "pathways.yaml", "package.json",
              "node_modules/@cosyte/hl7/package.json"];
            const absent = [".pathways", "data", "Dockerfile", ".dockerignore",
              "node_modules/@cosyte/pathways"];
            for (const p of present) if (!existsSync(`/project/${p}`)) throw new Error(`missing ${p}`);
            for (const p of absent) if (existsSync(`/project/${p}`)) throw new Error(`present ${p}`);
          '

      # As a deployment runs it: the master key mounted from outside, and the engine writing its
      # database and the message folders to mounted volumes, never into the image.
      - name: The project image runs the channel with the key and the database mounted
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/project"
          state="$RUNNER_TEMP/state"
          data="$RUNNER_TEMP/data"
          mkdir -p "$state" "$data/adt-to-lab/in"
          cp "$project/.pathways/dev.key" "$state/"
          cp "$project/channels/adt-to-lab/tests/a01.hl7" "$project/channels/adt-to-lab/tests/a08.hl7" "$data/adt-to-lab/in/"
          touch -d '1 minute ago' "$data/adt-to-lab/in/a01.hl7" "$data/adt-to-lab/in/a08.hl7"
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$state:/project/.pathways" --volume "$data:/project/data" project:ci start --once
          cmp "$data/adt-to-lab/out/1-1.hl7" "$project/channels/adt-to-lab/tests/a01.expected.hl7"
          test -f "$state/pathways.db"

      - name: Image sizes
        run: |
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E '^(localhost:5000/pathways|project):ci ' | tee -a "$GITHUB_STEP_SUMMARY"
