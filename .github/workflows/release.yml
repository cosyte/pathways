name: Release

# Thin caller of the shared release pipeline: Changesets -> npm publish through trusted publishing
# (OIDC, with provenance) -> docs artifacts -> GitHub release -> a dispatch that rebuilds docs.cosyte.com.
# No npm token exists: the package's trusted publisher on npmjs.com names this repository and this
# file, and npm exchanges the job's `id-token: write` grant for a short-lived publish token.
# `secrets: inherit` passes DOCS_REPO_DISPATCH_TOKEN, and RELEASE_PR_TOKEN when one is set.
#
# Before the first run, three things outside this file have to hold, or the run fails and nothing is
# published:
#
#   1. A `release` environment on this repository with at least one required reviewer and a custom
#      deployment branch policy naming `main` and nothing else. The shared pipeline's first step
#      reads that environment and refuses the run when either rule is missing.
#   2. The shared pipeline's version job runs on Node 22, and this package's floor is Node 24
#      (`engines.node`, with `engine-strict=true` in .npmrc), so `pnpm install` there refuses. It
#      needs the shared workflow to take a Node version for that job, and this caller to pass 24.
#   3. `@cosyte/pathways` does not exist on npm yet, and npm only lets a trusted publisher be set on
#      a package that exists. On a package npm does not have, the shared pipeline takes its direct
#      publish arm with this job's OIDC token, which no trusted publisher accepts, so that publish
#      fails. The package is created by a maintainer, with their own npm credential: either
#      `npm publish` (2FA), or `npm stage publish`, which puts a public `0.0.0-stage` placeholder on
#      npm and holds the real version until a maintainer approves it with 2FA. The trusted publisher
#      is added after that, and a publish through it has to follow within 48 hours or the entry
#      expires.
#
# test/package.test.ts holds this caller to the package: the same published reference as ci.yml,
# this package's name, the same unpublished-dependency allowance as CI's prepublish job, and the
# `version` and `pack:docs` scripts the shared pipeline runs.

on:
  push:
    branches: [main]

# Read-only by default: the release job below grants itself the writes the shared pipeline needs.
permissions:
  contents: read

jobs:
  release:
    # Required. The repo default for GITHUB_TOKEN is `contents: read`, and a called workflow can only
    # downgrade the caller's token, never escalate it, so without this the shared pipeline's
    # `contents/id-token/pull-requests: write` is an escalation and GitHub rejects the whole workflow
    # at startup (1s, no jobs, no logs).
    permissions:
      actions: read # the shared workflow reads this caller's environment protection with it
      contents: write # create tags / the GitHub release
      id-token: write # npm trusted publishing and provenance
      pull-requests: write # open the "Version Packages" PR
    uses: cosyte/.github/.github/workflows/release.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
    with:
      package-name: "@cosyte/pathways"
      # Every dependency is on npm, so nothing is excused: the same empty allowance ci.yml gives the
      # prepublish job. The shared default excuses @cosyte/fhir, which has since published.
      expect-unpublished-deps: ""
    secrets: inherit
