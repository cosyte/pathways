name: Public-surface gate

# Keeps our own bookkeeping (item ids, phase and wave words, ADR numbers, internal paths) off what a
# user reads: the README, docs-content, the LICENSE, the starter `pathways init` writes, and the doc
# comments that ship in dist/*.d.ts. The gate is the internal-refs command of `@cosyte/script-utils`
# (`pnpm check:no-internal-refs`), and `scripts/internal-refs.json` holds this repository's axes.
#
# WHY A LOCAL JOB, and not the shared gate-no-internal-refs-install.yml: the shared gates run on
# Node 22, and Pathways needs Node 24 (engines, with engine-strict), so pnpm refuses the install
# there. The job's name is the context the shared caller would publish, so moving to the shared
# gate once it takes a Node version is a `uses:` line and not a ruleset edit.

on:
  push:
    branches: [main]
  # No `edited` type: nothing in this gate reads the text of a pull request.
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-internal-refs:
    name: no-internal-refs / public-surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # The Node floor, which engines.node and ci.yml's matrix state.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      # The gate needs its package on disk and nothing built, so no lifecycle script runs.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Scan the public surface
        run: pnpm check:no-internal-refs
