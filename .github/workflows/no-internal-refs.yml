name: Public-surface gate

# Keeps our own bookkeeping (item ids, phase and wave words, ADR numbers, internal paths) off what a
# user reads: the README, docs-content, the LICENSE, the starter `pathways init` writes, and the doc
# comments that ship in dist/*.d.ts. The gate is the internal-refs command of `@cosyte/script-utils`
# (`pnpm check:no-internal-refs`), and `scripts/internal-refs.json` holds this repository's axes.
#
# The installing form of the shared gate, because the command lives in node_modules. It runs on
# Node 24, our floor: on its default of 22, pnpm refuses the install, because engines.node starts at
# 24 with engine-strict. The job id stays `no-internal-refs`, so the required context is still
# `no-internal-refs / public-surface`.

on:
  push:
    branches: [main]
  # No `edited` type: nothing in this gate reads the text of a pull request.
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-internal-refs:
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs-install.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
    with:
      node-version: "24"
    permissions:
      contents: read
