name: Probe

on:
  push:
    branches: [ci/windows-macos-tarball-smoke]

permissions:
  contents: read

jobs:
  probe:
    uses: cosyte/.github/.github/workflows/ci.yml@0be6757a773885cbd5165dbfa0f93772d907b3e8 # workflows-2026-11-10-0be6757a7738
    with:
      run-phi-scan: true
      node-versions: '["24"]'
      os: '["windows-latest", "macos-latest"]'
      expect-unpublished-deps: ""
      run-actionlint: false
      run-prepublish-manifest-lint: false
      run-prepublish-install: false

  tarball-smoke:
    name: tarball-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out text files with LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack the package
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Install the tarball in an empty folder, then init, test and start --once
        run: pnpm exec tsx scripts/tarball-smoke.ts "$RUNNER_TEMP"/cosyte-pathways-*.tgz
