name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly on main at 05:47 UTC. An odd minute: GitHub delays scheduled runs at the top of the hour.
    - cron: "47 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The shared pipeline: typecheck, lint, format, PHI scan, test, coverage, build, attw and the dual
  # ESM/CJS smoke in `verify`, plus `prepublish` and `actionlint`.
  #
  # The Node matrix is stated here on purpose, and it is bound to `engines.node` in package.json:
  # test/package.test.ts fails when they disagree. Each value is a required check
  # (`ci / verify (24, ubuntu-latest)`, `ci / verify (26, ubuntu-latest)`), so change the ruleset
  # first when adding a line, and never drop one before removing its context from the ruleset.
  #
  # The performance standard's two jobs run beside `verify`, never after it, so a pull request waits
  # for the slowest job rather than their sum:
  # - `scaling-gate`: `pnpm test:perf`, the scaling gates in test/perf/ and their self-checks,
  #   never under coverage;
  # - `bench-compare` (pull requests only): bench/pathways.bench.mjs timed on the base build and the
  #   head build, interleaved on one runner. Advisory: it never fails, so never require it.
  # A skipped job satisfies a required check, so require `scaling-gate` only while its input below
  # stays on. The full reading, the budgets and the profile are in bench-reading.yml. This caller
  # moved to the 2026-11-10 reference, the first with those two jobs, and release.yml with it, since
  # test/package.test.ts holds the two to one commit (its release workflow is unchanged between the
  # two references); the other callers stay where they were. The jobs that reference added beside
  # these two (bun, deno, coverage-ratchet, mutation) stay off, as their inputs default to.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@0be6757a773885cbd5165dbfa0f93772d907b3e8 # workflows-2026-11-10-0be6757a7738
    with:
      run-phi-scan: true
      node-versions: '["24", "26"]'
      expect-unpublished-deps: ""
      run-scaling-gate: true
      run-bench-compare: true
      bench-suites: bench/pathways.bench.mjs
      # The docs-content structure check, inside `verify`, before the install: every link and image
      # under docs-content/ that points inside the package, and every page id sidebars.json names,
      # must resolve. A finding fails `verify` on both Node lines.
      check-docs-content: true

  # The API reference in docs-content/api/ held to the source, with `cosyte-docs-reference --check`
  # from @cosyte/process. It fails when the committed pages differ from what the TSDoc comments
  # generate (an export changed and `pnpm docs:reference` was not run), and when an export has no
  # TSDoc summary. The shared workflow has no input for it, so it is a job of its own beside `ci`,
  # and its context is `docs-reference`. Never rename it once the ruleset requires it.
  docs-reference:
    name: docs-reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # The Node floor, which engines.node and the matrix above state.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      # TypeDoc reads the source and its types from node_modules; nothing is built.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: docs-content/api matches the source, and every export has a TSDoc summary
        run: pnpm check:docs-reference
